<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jedi Council Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<!--    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <style type="text/tailwindcss">
        @theme {
            --font-display: 'Cinzel', serif;
        }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,#1e293b,#020617_70%)] bg-fixed text-stone-200 antialiased">
<main class="mx-auto max-w-3xl px-4 py-12">
    <header class="mb-10 text-center">
        <p class="font-display text-xs uppercase tracking-[0.5em] text-amber-500/70">Coruscant · Jedi Temple</p>
        <h1 class="mt-2 font-display text-4xl font-bold uppercase tracking-widest text-amber-300 drop-shadow-[0_0_12px_rgba(251,191,36,0.35)] sm:text-5xl">
            Council Archive
        </h1>
        <div class="mx-auto mt-4 h-px w-48 bg-gradient-to-r from-transparent via-amber-400 to-transparent"></div>
    </header>

    <form id="entry-form" class="mb-6 grid gap-3 rounded-xl border border-amber-500/30 bg-slate-900/70 p-6 shadow-[0_0_30px_rgba(0,0,0,0.6)] backdrop-blur">
        <h2 class="font-display text-sm uppercase tracking-widest text-amber-400/80">Record a Jedi</h2>

        <input type="hidden" id="entry-id">

        <input id="name" placeholder="Name" required
               class="rounded-lg border border-slate-600 bg-slate-950/70 px-3 py-2 text-stone-100 placeholder-slate-500 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30">
        <input id="role" placeholder="Role" required
               class="rounded-lg border border-slate-600 bg-slate-950/70 px-3 py-2 text-stone-100 placeholder-slate-500 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30">
        <input id="planet" placeholder="Home planet" required
               class="rounded-lg border border-slate-600 bg-slate-950/70 px-3 py-2 text-stone-100 placeholder-slate-500 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30">

        <div class="flex gap-2 pt-1">
            <button type="submit" id="save-btn"
                    class="rounded-lg border border-amber-400/60 bg-amber-500/10 px-5 py-2 font-display text-sm uppercase tracking-wider text-amber-300 transition hover:bg-amber-400 hover:text-slate-950 hover:shadow-[0_0_18px_rgba(251,191,36,0.5)]">
                Add entry
            </button>
            <button type="button" id="cancel-btn" hidden
                    class="rounded-lg border border-slate-600 px-5 py-2 font-display text-sm uppercase tracking-wider text-slate-400 transition hover:border-slate-400 hover:text-slate-200">
                Cancel edit
            </button>
        </div>
    </form>

    <p id="message" class="mb-4 min-h-6 text-center text-sm italic"></p>

    <section id="detail" hidden
             class="mb-8 rounded-xl border-2 border-amber-400/60 bg-slate-900/80 p-6 shadow-[0_0_35px_rgba(251,191,36,0.2)]">
        <div class="flex items-start justify-between gap-4">
            <h2 id="detail-name" class="font-display text-2xl font-bold uppercase tracking-wider text-amber-300"></h2>
            <button type="button" id="detail-close" aria-label="Close"
                    class="rounded-md px-2 py-1 text-slate-500 transition hover:bg-slate-800 hover:text-amber-300">X</button>
        </div>
        <div class="my-4 h-px bg-gradient-to-r from-amber-400/60 to-transparent"></div>
        <dl class="grid grid-cols-[auto_1fr] gap-x-6 gap-y-2 text-sm">
            <dt class="font-display uppercase tracking-wider text-slate-500">Role</dt>
            <dd id="detail-role" class="text-stone-100"></dd>
            <dt class="font-display uppercase tracking-wider text-slate-500">Planet</dt>
            <dd id="detail-planet" class="text-stone-100"></dd>
            <dt class="font-display uppercase tracking-wider text-slate-500">ID</dt>
            <dd id="detail-id" class="font-mono text-xs text-slate-500"></dd>
        </dl>
    </section>

    <input id="search" type="search" placeholder="Search the archives..."
           class="mb-4 w-full rounded-lg border border-slate-600 bg-slate-950/70 px-4 py-2 text-stone-100 placeholder-slate-500 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30">

    <ul id="entries" class="space-y-3"></ul>

    <div class="mt-10 text-center">
        <a href="/api/archive/download"
           class="inline-block rounded-lg border border-slate-600 px-5 py-2 font-display text-xs uppercase tracking-widest text-slate-400 transition hover:border-cyan-400 hover:text-cyan-300 hover:shadow-[0_0_15px_rgba(34,211,238,0.35)]">
            Download archive
        </a>
    </div>

    <p class="mt-10 text-center font-display text-xs uppercase tracking-[0.4em] text-slate-600">
        May the Force be with you
    </p>
</main>

<script src="/js/api.js"></script>
<script src="/js/archives.js"></script>
</body>
</html>
